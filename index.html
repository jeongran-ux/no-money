<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131920" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#17202B; --muted:#667280; --line:#D6DCE3;
  --money:#17805E; --money-soft:#D2ECE2; --mid:#C28A00; --over:#C0304A; --over-soft:#F7DDE2; --track:#E2E7EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131920; --surface:#1C242E; --ink:#E6ECF2; --muted:#8C98A6; --line:#2C3743;
    --money:#4CC398; --money-soft:#1E3A31; --mid:#EDC04A; --over:#F0697F; --over-soft:#43232A; --track:#26303B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131920; --surface:#1C242E; --ink:#E6ECF2; --muted:#8C98A6; --line:#2C3743;
  --money:#4CC398; --money-soft:#1E3A31; --mid:#EDC04A; --over:#F0697F; --over-soft:#43232A; --track:#26303B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--money);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding:12px 18px 200px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
.month{display:flex;align-items:center;gap:2px}
.month h1{margin:0 6px;font-size:19px;font-weight:600;min-width:7.5em;text-align:center}
.icon-btn{background:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--track)}
.icon-btn svg{width:22px;height:22px}

/* hero: the envelope */
.hero{padding:22px 0 18px}
.week-name{font-size:15px;color:var(--muted);margin:0}
.lv-ok{--c:var(--money)} .lv-mid{--c:var(--mid)} .lv-low{--c:var(--over)}
.remain{margin:2px 0 0;font-size:clamp(46px,15vw,68px);font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--c,var(--money));transition:color .3s}
.remain small{font-size:.38em;font-weight:600;letter-spacing:0;margin-left:4px}
.hero-sub{margin:6px 0 16px;color:var(--muted);font-size:15px}
.hero-sub b{color:var(--ink);font-weight:600}
.bar{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--money));transition:width .35s ease,background .3s;border-radius:6px}
.bar.over{background:var(--over-soft)}
.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}

/* week strip */
.strip{display:grid;gap:8px;margin:6px 0 8px}
.wk{background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.wk.sel{border-color:var(--ink)}
.wk .track{width:14px;height:52px;border-radius:7px;background:var(--track);position:relative;overflow:hidden}
.wk .track i{position:absolute;left:0;right:0;bottom:0;background:var(--c,var(--money));border-radius:7px}
.wk.over .track{background:var(--over-soft)}
.wk .lbl{font-size:13px;font-weight:600;position:relative}
.wk .lbl.now::after{content:"";position:absolute;right:-8px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--money)}
.wk .amt{font-size:12px;color:var(--muted)}
.wk.over .amt{color:var(--over)}

.month-sum{font-size:14px;color:var(--muted);margin:10px 2px 22px}
.month-sum b{color:var(--ink);font-weight:600}

/* list */
.day{margin:0 0 14px}
.day h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 6px;display:flex;justify-content:space-between}
.items{background:var(--surface);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .memo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .memo.none{color:var(--muted)}
.item .a{font-weight:600}
.del{background:none;border:0;width:34px;height:34px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.del:active{background:var(--track)}
.del svg{width:16px;height:16px}
.empty{background:var(--surface);border-radius:16px;padding:22px 18px;color:var(--muted);font-size:15px;text-align:center}

/* setup prompt */
.setup{background:var(--surface);border-radius:18px;padding:22px 20px;margin-top:10px}
.setup p{margin:0 0 14px;color:var(--muted)}
.setup h2{margin:0 0 6px;font-size:20px}

/* bottom input bar */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.dock-in{max-width:480px;margin:0 auto;display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.field{background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:0 12px;height:48px;display:flex;align-items:center;min-width:0}
.field:focus-within{border-color:var(--money)}
.field input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:16px}
.field.amount{flex:1}
.field.amount input{font-size:20px;font-weight:600}
.field.amount span{color:var(--muted);font-weight:600;margin-left:4px}
.field.memo{flex:1}
.field.date{flex:0 0 auto;width:132px;padding:0 8px}
.field.date input{font-size:15px}
.go{height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--money);color:#fff;font-weight:600;font-size:16px;flex:0 0 auto}
[data-theme="dark"] .go{color:#0E1A15}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{color:#0E1A15}}
.go:active{filter:brightness(.92)}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip:active{background:var(--track)}

/* settings dialog */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,15,20,.45)}
.sheet{padding:22px 20px 18px;max-height:calc(100dvh - 40px);overflow-y:auto}
.preview{display:grid;gap:6px;margin:4px 0 18px}
.preview div{background:var(--bg);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted);line-height:1.35}
.preview b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.scope{display:flex;gap:6px;margin-bottom:4px}
.scope label{flex:1;text-align:center;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);font-size:14px}
.scope label:has(input:checked){border-color:var(--money);font-weight:600}
.scope input{position:absolute;opacity:0;pointer-events:none}
.sheet h2{margin:0 0 16px;font-size:19px}
.sheet label.t{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.sheet .field{margin-bottom:18px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:8px}
.opt:has(input:checked){border-color:var(--money)}
.opt input{margin-top:5px;accent-color:var(--money)}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:13px}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;margin-top:18px;align-items:center}
.link{background:none;border:0;color:var(--over);font-size:14px;padding:8px 4px}
.ghost{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:none}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:88vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast{display:flex;align-items:center;gap:14px;white-space:nowrap}
.undo{background:none;border:0;padding:4px 0;color:inherit;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month">
      <button class="icon-btn" id="prevM" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 id="monthTitle" class="num"></h1>
      <button class="icon-btn" id="nextM" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="icon-btn" id="openSet" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <div id="main"></div>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="chips">
      <button class="chip" data-add="1000">+1천</button>
      <button class="chip" data-add="5000">+5천</button>
      <button class="chip" data-add="10000">+1만</button>
      <button class="chip" data-add="50000">+5만</button>
    </div>
    <div class="row">
      <label class="field amount"><input id="amt" inputmode="numeric" autocomplete="off" placeholder="얼마 썼나요" aria-label="금액" class="num"><span>원</span></label>
      <button class="go" id="add">기록</button>
    </div>
    <div class="row">
      <label class="field memo"><input id="memo" autocomplete="off" placeholder="어디에 (선택)" aria-label="메모" maxlength="40"></label>
      <label class="field date"><input id="date" type="date" aria-label="날짜"></label>
    </div>
  </div>
</div>

<dialog id="settings">
  <div class="sheet">
    <h2 id="setTitle">목표 금액</h2>
    <label class="t" for="goalIn" id="goalLbl"></label>
    <label class="field"><input id="goalIn" inputmode="numeric" class="num" placeholder="예: 500,000" autocomplete="off"><span style="color:var(--muted);font-weight:600;margin-left:4px">원</span></label>
    <label class="t" id="modeLbl">주별로 나누는 방법</label>
    <label class="opt"><input type="radio" name="mode" value="days"><span><b>날짜 수에 맞게</b><small>며칠만 걸친 주는 그만큼 적게 받아요.</small></span></label>
    <label class="opt"><input type="radio" name="mode" value="equal"><span><b>모든 주에 똑같이</b><small>며칠짜리 주도 같은 금액을 받아요.</small></span></label>
    <div class="preview num" id="preview"></div>
    <label class="t">적용 범위</label>
    <div class="scope">
      <label><input type="radio" name="scope" value="on">이 달부터 계속</label>
      <label><input type="radio" name="scope" value="only">이 달만</label>
    </div>
    <div class="actions">
      <button class="link" id="reset">모든 기록 지우기</button>
      <div class="row">
        <button class="ghost" id="cancelSet">닫기</button>
        <button class="go" id="saveSet">저장</button>
      </div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const KEY='weekly-envelope-v1';
const DOW=['월','화','수','목','금','토','일'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ymKey=(y,m)=>`${y}-${pad(m+1)}`;
const won=n=>Math.round(n).toLocaleString('ko-KR');
const digits=s=>parseInt(String(s).replace(/[^0-9]/g,''),10)||0;
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';if(a>=10000){const v=a/10000;return s+(v>=100?Math.round(v):v.toFixed(1).replace(/\.0$/,''))+'만'}return s+a.toLocaleString('ko-KR')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return{goals:o.goals||{},modes:o.modes||{},mode:o.mode==='equal'?'equal':'days',entries:Array.isArray(o.entries)?o.entries:[]}}}catch(e){}
  return{goals:{},modes:{},mode:'days',entries:[]};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장하지 못했어요. 브라우저 저장공간을 확인해 주세요.')}}

function goalFor(y,m){
  const k=ymKey(y,m);
  if(S.goals[k]!=null)return S.goals[k];
  const prev=Object.keys(S.goals).filter(x=>x<k).sort().pop();
  return prev?S.goals[prev]:0;
}
function modeFor(y,m){
  const k=ymKey(y,m);
  if(S.modes[k])return S.modes[k];
  const prev=Object.keys(S.modes).filter(x=>x<k).sort().pop();
  return prev?S.modes[prev]:S.mode;
}
const nextYM=(y,m)=>m===11?[y+1,0]:[y,m+1];
function weeksOf(y,m){
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const start=new Date(first);start.setDate(start.getDate()-((start.getDay()+6)%7));
  const out=[];
  while(start<=last){
    const end=new Date(start);end.setDate(end.getDate()+6);
    const s=start<first?new Date(first):new Date(start);
    const e=end>last?new Date(last):end;
    out.push({s,e,days:Math.round((e-s)/864e5)+1,from:ds(s),to:ds(e)});
    start.setDate(start.getDate()+7);
  }
  return out;
}
function allocate(goal,weeks,mode){
  const n=weeks.length;
  if(mode==='equal'){const b=Math.floor(goal/n);return weeks.map((w,i)=>i===n-1?goal-b*(n-1):b)}
  const total=weeks.reduce((a,w)=>a+w.days,0);let cum=0,prev=0;
  return weeks.map(w=>{cum+=w.days;const v=Math.round(goal*cum/total);const r=v-prev;prev=v;return r});
}
const level=(rem,budget)=>{if(budget<=0||rem<=0)return 'lv-low';const p=rem/budget*100;return p>=70?'lv-ok':p>=40?'lv-mid':'lv-low'};
const idxOf=(weeks,dstr)=>weeks.findIndex(w=>w.from<=dstr&&dstr<=w.to);

const now=new Date();
let vy=now.getFullYear(),vm=now.getMonth(),vw=null;

function render(){
  const weeks=weeksOf(vy,vm),goal=goalFor(vy,vm),alloc=allocate(goal,weeks,modeFor(vy,vm));
  const todayS=ds(new Date()),todayIdx=idxOf(weeks,todayS);
  if(vw==null||vw>=weeks.length)vw=todayIdx>=0?todayIdx:0;
  $('monthTitle').textContent=`${vy}년 ${vm+1}월`;

  const spent=weeks.map(w=>S.entries.filter(e=>e.d>=w.from&&e.d<=w.to).reduce((a,e)=>a+e.a,0));
  const main=$('main');

  if(!goal){
    main.innerHTML=`<div class="setup"><h2>${vm+1}월에 쓸 돈을 정해 주세요</h2><p>정한 금액을 주별로 나눠서, 기록할 때마다 이번 주 남은 돈을 바로 보여줘요.</p><button class="go" id="setupBtn">목표 금액 정하기</button></div>`;
    $('setupBtn').onclick=openSettings;
    syncDate(weeks);return;
  }

  const w=weeks[vw],budget=alloc[vw],rem=budget-spent[vw],over=rem<0;
  const pct=budget>0?Math.max(0,Math.min(1,rem/budget))*100:0;
  const range=`${w.s.getMonth()+1}/${w.s.getDate()}–${w.e.getMonth()+1}/${w.e.getDate()}`;
  const monthSpent=spent.reduce((a,b)=>a+b,0),monthRem=goal-monthSpent;

  const lv=level(rem,budget);
  let html=`<section class="hero ${lv}">
    <p class="week-name">${vw===todayIdx?'이번 주':`${vw+1}주차`} 남은 돈 <span class="num">(${range})</span></p>
    <p class="remain num${over?' over':''}" id="remainNum">${over?'-':''}${won(Math.abs(rem))}<small>원</small></p>
    <p class="hero-sub num">${over?`<b>${won(-rem)}원</b> 넘게 썼어요. 예산 ${won(budget)}원`:`예산 <b>${won(budget)}원</b> 중 <b>${won(spent[vw])}원</b> 썼어요`}</p>
    <div class="bar${over?' over':''}"><i style="width:${pct}%"></i></div>
  </section>
  <div class="strip" style="grid-template-columns:repeat(${weeks.length},1fr)">`;
  weeks.forEach((wk,i)=>{
    const r=alloc[i]-spent[i],p=alloc[i]>0?Math.max(0,Math.min(1,r/alloc[i]))*100:0;
    html+=`<button class="wk ${level(r,alloc[i])}${i===vw?' sel':''}${r<0?' over':''}" data-w="${i}" aria-label="${i+1}주차, 남은 돈 ${won(r)}원">
      <span class="track"><i style="height:${p}%"></i></span>
      <span class="lbl${i===todayIdx?' now':''}">${i+1}주</span>
      <span class="amt num">${short(r)}</span></button>`;
  });
  html+=`</div>
  <p class="month-sum num">${vm+1}월 전체: <b>${won(goal)}원</b> 중 ${monthRem<0?`<b style="color:var(--over)">${won(-monthRem)}원 초과</b>`:`<b>${won(monthRem)}원</b> 남음`}</p>`;

  const list=S.entries.filter(e=>e.d>=w.from&&e.d<=w.to).sort((a,b)=>b.d.localeCompare(a.d)||b.t-a.t);
  if(!list.length){
    html+=`<div class="empty">이 주에는 아직 기록이 없어요. 아래에 금액을 적고 기록을 누르세요.</div>`;
  }else{
    const byDay={};list.forEach(e=>(byDay[e.d]=byDay[e.d]||[]).push(e));
    Object.keys(byDay).sort().reverse().forEach(d=>{
      const dt=parseD(d),sum=byDay[d].reduce((a,e)=>a+e.a,0);
      html+=`<div class="day"><h3><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[(dt.getDay()+6)%7]})${d===todayS?' 오늘':''}</span><span class="num">${won(sum)}원</span></h3><div class="items">`;
      byDay[d].forEach(e=>{
        html+=`<div class="item"><span class="memo${e.m?'':' none'}">${e.m?esc(e.m):'메모 없음'}</span><span class="a num">${won(e.a)}원</span>
        <button class="del" data-del="${e.id}" aria-label="${won(e.a)}원 기록 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
      });
      html+=`</div></div>`;
    });
  }
  main.innerHTML=html;
  main.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{vw=+b.dataset.w;render()});
  main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const e=S.entries.find(x=>x.id===b.dataset.del);if(!e)return;
    S.entries=S.entries.filter(x=>x.id!==e.id);save();render();
    toast(`${won(e.a)}원 기록을 지웠어요`,{label:'되돌리기',fn:()=>{if(!S.entries.some(x=>x.id===e.id)){S.entries.push(e);save();render()}}});
  });
  syncDate(weeks);
}

let dateTouched=false;
function syncDate(weeks){
  if(dateTouched)return;
  const w=weeks[vw]||weeks[0],t=ds(new Date());
  $('date').value=(t>=w.from&&t<=w.to)?t:w.from;
}
$('date').addEventListener('change',()=>{dateTouched=true});

// amount input formatting
const amt=$('amt');
amt.addEventListener('input',()=>{const v=digits(amt.value);amt.value=v?won(v):''});
document.querySelectorAll('[data-add]').forEach(c=>c.onclick=()=>{amt.value=won(digits(amt.value)+ +c.dataset.add)});

function addEntry(){
  const a=digits(amt.value),d=$('date').value;
  if(!a){toast('금액을 입력해 주세요');amt.focus();return}
  if(!d){toast('날짜를 선택해 주세요');return}
  S.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d,a,m:$('memo').value.trim(),t:Date.now()});
  save();
  const dt=parseD(d);vy=dt.getFullYear();vm=dt.getMonth();vw=idxOf(weeksOf(vy,vm),d);
  amt.value='';$('memo').value='';dateTouched=false;
  render();
  const r=$('remainNum');if(r){r.classList.remove('pulse');void r.offsetWidth;r.classList.add('pulse')}
  toast(`${won(a)}원 기록했어요`);
  amt.blur();$('memo').blur();
}
$('add').onclick=addEntry;
[amt,$('memo')].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addEntry()}}));

$('prevM').onclick=()=>{vm--;if(vm<0){vm=11;vy--}vw=null;dateTouched=false;render()};
$('nextM').onclick=()=>{vm++;if(vm>11){vm=0;vy++}vw=null;dateTouched=false;render()};

// settings
const dlg=$('settings');
let resetArmed=false,rt;
function disarm(){resetArmed=false;clearTimeout(rt);const b=$('reset');if(b)b.textContent='모든 기록 지우기'}
function openSettings(){
  disarm();
  $('setTitle').textContent=`${vy}년 ${vm+1}월 설정`;
  $('goalLbl').textContent='이 달에 쓸 돈';
  $('modeLbl').textContent=`주별로 나누는 방법 (이 달은 ${weeksOf(vy,vm).length}주)`;
  const g=goalFor(vy,vm);$('goalIn').value=g?won(g):'';
  const md=modeFor(vy,vm);
  document.querySelectorAll('input[name=mode]').forEach(r=>r.checked=r.value===md);
  document.querySelectorAll('input[name=scope]').forEach(r=>r.checked=r.value==='on');
  preview();
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
}
function closeSettings(){if(dlg.close)dlg.close();else dlg.removeAttribute('open')}
$('openSet').onclick=openSettings;
$('cancelSet').onclick=closeSettings;
$('goalIn').addEventListener('input',e=>{const v=digits(e.target.value);e.target.value=v?won(v):'';preview()});
document.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener('change',preview));
function preview(){
  const el=$('preview'),weeks=weeksOf(vy,vm),g=digits($('goalIn').value);
  const m=(document.querySelector('input[name=mode]:checked')||{}).value||'days';
  el.style.gridTemplateColumns=`repeat(${weeks.length},1fr)`;
  if(!g){el.innerHTML='';return}
  el.innerHTML=allocate(g,weeks,m).map((a,i)=>`<div><b>${short(a)}</b>${i+1}주 ${weeks[i].days}일</div>`).join('');
}
$('saveSet').onclick=()=>{
  const g=digits($('goalIn').value);
  if(!g){toast('목표 금액을 입력해 주세요');return}
  const k=ymKey(vy,vm),[ny,nm]=nextYM(vy,vm),nk=ymKey(ny,nm);
  const m=(document.querySelector('input[name=mode]:checked')||{}).value||modeFor(vy,vm);
  const only=(document.querySelector('input[name=scope]:checked')||{}).value==='only';
  if(only){
    // 다음 달이 이번 변경을 이어받지 않도록, 기존 설정을 다음 달에 고정
    const ng=goalFor(ny,nm),nmd=modeFor(ny,nm);
    if(S.goals[nk]==null&&ng)S.goals[nk]=ng;
    if(!S.modes[nk])S.modes[nk]=nmd;
  }
  S.goals[k]=g;S.modes[k]=m;
  save();closeSettings();render();toast('저장했어요');
};
$('reset').onclick=()=>{
  const b=$('reset');
  if(!resetArmed){resetArmed=true;b.textContent='한 번 더 누르면 모두 지워져요';clearTimeout(rt);rt=setTimeout(disarm,3000);return}
  disarm();S={goals:{},modes:{},mode:'days',entries:[]};save();closeSettings();vw=null;render();toast('모든 기록을 지웠어요')
};

let tt;function toast(msg,act){
  const t=$('toast');t.textContent='';
  const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  if(act){const b=document.createElement('button');b.className='undo';b.textContent=act.label;b.onclick=()=>{act.fn();hide()};t.appendChild(b)}
  t.style.pointerEvents=act?'auto':'none';t.classList.add('show');
  const hide=()=>{t.classList.remove('show');t.style.pointerEvents='none'};
  clearTimeout(tt);tt=setTimeout(hide,act?4500:1800);
}
